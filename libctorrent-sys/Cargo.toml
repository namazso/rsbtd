[package]
name = "libctorrent-sys"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Raw FFI bindings to libctorrent, a C interface for libtorrent-rasterbar"
links = "ctorrent"

[features]
# Build libtorrent 2.1 from vendor/libtorrent instead of using the system
# library, and link it statically into the Rust binary.
vendored = []

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"
