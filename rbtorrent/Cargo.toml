[package]
name = "rbtorrent"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Ergonomic Rust bindings for libtorrent-rasterbar"

[features]
vendored = ["libctorrent-sys/vendored"]

[dependencies]
libctorrent-sys = { path = "../libctorrent-sys" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
bitflags = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
trybuild = "1"
tempfile = "3"
