[package]
name = "rsbtctl"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Command-line control client for the rsbtd torrent daemon"

[features]
# The daemon-facing CI legs build the whole workspace with this feature;
# rsbtctl has no native dependencies, so it is a no-op here.
vendored = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
base64 = "0.22"
# ring (not the default aws-lc-rs) keeps the build free of external
# native dependencies.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
