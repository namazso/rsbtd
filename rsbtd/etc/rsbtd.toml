# rsbtd example configuration.
#
# Only daemon bootstrap concerns live here. All libtorrent settings
# (rate limits, DHT, listen interfaces, ...) are managed through the
# GraphQL API (`applySettings`) and persisted in the state directory —
# they survive restarts and never appear in this file.

# Directory for resume data and session state. Must be writable. The
# daemon creates it with owner-only permissions (0700) if it does not
# exist — session state can contain proxy credentials — which is why an
# inner folder is used here: systemd's StateDirectory creates
# /var/lib/rsbtd itself as 0755. Permissions of an existing directory
# are left alone, so they can be adjusted if needed.
state_dir = "/var/lib/rsbtd/state"

[api]
# Where the HTTP API listens: a TCP address or a unix socket.
# The API is plain HTTP — do not expose it beyond localhost without a
# reverse proxy providing TLS.
listen = "127.0.0.1:3928"
#listen = "unix:/run/rsbtd/api.sock"

# Static bearer token required on every request
# (Authorization: Bearer <token>). Omit to disable authentication.
token = "change-me"

# Serve the GraphiQL IDE on GET / (handy for exploring the schema).
# Mutually exclusive with serve_root.
#graphiql = true

# Serve a directory of static files on / — the rsbtd-webui package
# installs the built web UI at this path (any built copy of webui/dist
# works) — to have the daemon host its own UI.
#serve_root = "/usr/share/rsbtd/webui"

# Origins allowed to call the API from a browser (CORS). Use this instead
# of serve_root when the web UI is served from somewhere else; "*" allows
# any origin. Not needed for same-origin use (serve_root) or non-browser
# clients.
#cors = ["https://ui.example.com"]

# Seconds allotted to the shutdown persistence phase (resume-data flush
# and state writes); a stuck disk cannot hang shutdown past this.
#shutdown_grace_secs = 15
