	"""
	Milliseconds between internal ticks — the frequency at which
	bandwidth quota is distributed to peers; at most 1000. A low
	value (around 100) gives finer-grained rate limiting; a higher
	value saves CPU cycles.
	
	A negative value removes the once-per-second gate on the heavier
	per-torrent work (the timer itself still fires every
	millisecond). That is intended for tests and fuzzing that need
	the session to react instantly; do not use it in production.
	"""
	tickInterval: Int
	"""
	Target share ratio for share-mode torrents: at 3, the client
	tries to upload three times as much as it downloads. Values below
	2 make no sense, and too-high values are so conservative that
	nothing may be downloaded at all — a piece can only be uploaded
	as many times as there are peers who still need it.
	"""
	shareModeTarget: Int
	"""
	Session-global upload rate limit in bytes per second. 0 means
	unlimited. Peers on the local network are not rate limited by
	default.
	"""
	uploadRateLimit: Int
	"""
	Session-global download rate limit in bytes per second. 0 means
	unlimited. Peers on the local network are not rate limited by
	default.
	"""
	downloadRateLimit: Int
	"""
	Average bytes per second the DHT node is allowed to send. When
	incoming requests would exceed the quota with their responses,
	requests are dropped until the quota is replenished.
	"""
	dhtUploadRateLimit: Int
	"""
	Maximum number of unchoked peers in the session when
	`chokingAlgorithm` is `FIXED_SLOTS`. -1 means unlimited: all
	peers are always unchoked.
	"""
	unchokeSlotsLimit: Int
	"""
	Global limit on the number of open peer connections. A hard
	minimum of two connections per torrent still applies, so enough
	torrents can exceed a low limit.
	"""
	connectionsLimit: Int
	"""
	Number of incoming connections accepted beyond
	`connectionsLimit`, as candidates that may replace existing
	connections.
	"""
	connectionsSlack: Int
	"""
	Target one-way delay for uTP sockets, in milliseconds. Higher
	values are more aggressive and queue more at the upload
	bottleneck; too-low values drown in measurement noise and send
	too slowly.
	"""
	utpTargetDelay: Int
	"""
	Maximum bytes the uTP congestion window may grow within one
	round-trip time. Too high, and the controller overreacts to noise
	and becomes unstable; too low, and it reacts slowly to congestion
	(and backs off slowly).
	"""
	utpGainFactor: Int
	"""
	Shortest allowed uTP socket timeout, in milliseconds. The actual
	timeout scales with the connection's round-trip time but never
	goes below this value. A connection times out when a whole window
	is lost, or one packet is lost twice in a row; a shorter timeout
	recovers faster, provided the round-trip time is low enough.
	"""
	utpMinTimeout: Int
	"""
	Number of SYN packets sent — each timing out — before giving up
	and closing a uTP socket.
	"""
	utpSynResends: Int
	"""
	Number of FIN packets sent — each timing out — before giving up
	and closing a uTP socket.
	"""
	utpFinResends: Int
	"""
	Number of times one packet is resent (lost or timed out) before
	the uTP connection is considered broken and closed.
	"""
	utpNumResends: Int
	"""
	Timeout in milliseconds for the initial uTP SYN packet; each
	consecutive timeout doubles it.
	"""
	utpConnectTimeout: Int
	"""
	Percentage applied to the uTP congestion window when a packet
	loss is experienced. Do not change this unless you know what you
	are doing, and never set it above 100.
	"""
	utpLossMultiplier: Int
	"""
	Backlog passed to `listen()` on listen sockets: the number of
	pending incoming connections queued while not actively accepting.
	5 is sufficient for a normal client; raise it for
	high-performance servers expecting many connections. Takes effect
	the next time `listenInterfaces` is updated.
	"""
	listenQueueSize: Int
	"""
	Number of peers to connect immediately when the first tracker
	response for a torrent arrives, instead of waiting for the
	once-per-second connect scheduler — a boost that accelerates new
	torrents. At most 255.
	"""
	torrentConnectBoost: Int
	"""
	Maximum size in bytes of metadata (.torrent contents) accepted
	via the metadata extension, i.e. from magnet links.
	"""
	maxMetadataSize: Int
	"""
	Number of disk I/O threads used for piece-hash verification
	during full torrent checking, in addition to the regular
	`aioThreads` (hash checks during normal download use the regular
	threads). Hasher threads also perform the disk reads; on storage
	optimized for sequential access, such as hard drives, 1 (the
	default) is best.
	"""
	hashingThreads: Int
	"""
	Number of 16 KiB blocks kept outstanding while checking torrents.
	Higher values give faster rechecks but use more memory.
	"""
	checkingMemUsage: Int
	"""
	When above 0, pieces are announced to peers this many
	milliseconds before they are expected to finish downloading — and
	before they are hash-checked — to gain up to 1.5 round trips per
	piece. 0 disables predictive announcing.
	"""
	predictivePieceAnnounce: Int
	"""
	Number of disk I/O threads, for the asynchronous I/O back-ends
	that use a thread pool.
	"""
	aioThreads: Int
	"""
	How aggressively to back off from retrying failing trackers: the
	wait before retry number `fails` is `5 + 5 × trackerBackoff / 100
	× fails²` seconds.
	"""
	trackerBackoff: Int
	"""
	Share ratio (uploaded/downloaded) as a percentage at which a
	seeding torrent is considered done and yields queue priority to
	other torrents (it may still seed, just without priority). See
	also `seedTimeRatioLimit` and `seedTimeLimit`.
	"""
	shareRatioLimit: Int
	"""
	Seed-time ratio (seconds as seed over seconds as downloader) as a
	percentage at which a seeding torrent is considered done and
	yields queue priority to other torrents (it may still seed, just
	without priority). See also `shareRatioLimit` and
	`seedTimeLimit`.
	"""
	seedTimeRatioLimit: Int
	"""
	Percentage of a torrent's peers to disconnect in each turnover
	round (every `peerTurnoverInterval` seconds), to make room for
	trying other peers. Only applies while above the
	`peerTurnoverCutoff` fill grade.
	"""
	peerTurnover: Int
	"""
	Fill grade that triggers peer turnover, as a percentage of the
	torrent's connection limit: `peerTurnover` disconnects only
	happen while more peers than that are connected.
	"""
	peerTurnoverCutoff: Int
	"""
	Seconds between peer-turnover rounds — the optimistic disconnects
	governed by `peerTurnover` and `peerTurnoverCutoff`.
	"""
	peerTurnoverInterval: Int
	"""
	Every n-th connection attempt is granted to a seeding or finished
	torrent instead of a downloading one; this is n. Connection
	attempts are a limited resource (`connectionSpeed`), and
	downloading torrents are prioritized for them by default.
	"""
	connectSeedEveryNDownload: Int
	"""
	Maximum size in bytes of an HTTP response accepted when
	announcing to trackers or downloading .torrent files.
	"""
	maxHttpRecvBufferSize: Int
	"""
	Number of times to retry binding a listen port that failed,
	incrementing the port by one each try.
	"""
	maxRetryPortBind: Int
	"""
	Download rate in bytes per second below which a torrent may count
	as inactive for queuing: a torrent below both `inactiveDownRate`
	and `inactiveUpRate` for `autoManageStartup` seconds is
	considered inactive, and another queued torrent may start. Only
	applies when `dontCountSlowTorrents` is true.
	"""
	inactiveDownRate: Int
	"""
	Upload rate in bytes per second below which a torrent may count
	as inactive for queuing; see `inactiveDownRate`.
	"""
	inactiveUpRate: Int
	"""
	Maximum web-seed request range in bytes — the largest possible
	single sequential request. Values below the piece size are
	ignored. Relate it to the download speed to avoid creating too
	many expensive HTTP requests per second, but note that a request
	spanning the whole file precludes parallel requests, and that
	combining web seeds with rarest-first BitTorrent downloading
	splits requests around already-picked pieces.
	"""
	urlseedMaxRequestBytes: Int
	"""
	Seconds to wait before retrying a failed web-seed hostname
	lookup.
	"""
	webSeedNameLookupRetry: Int
	"""
	Seconds between closing the file that has been open the longest,
	nudging the operating system to flush its disk cache; observed to
	be necessary on Windows to keep the cache bounded. 0 disables the
	feature (the default everywhere except Windows, where it defaults
	to 240).
	"""
	closeFileInterval: Int
	"""
	Milliseconds after a uTP congestion-window reduction during which
	further packet losses do not reduce the window again.
	"""
	utpCwndReduceTimer: Int
	"""
	Maximum web-seed connections per torrent.
	"""
	maxWebSeedConnections: Int
	"""
	Seconds a hostname stays in the internal DNS cache before it is
	considered out of date and removed; negative values mean zero.
	Failed lookups are cached too, for one eighth of this time.
	"""
	resolverCacheTimeout: Int
	"""
	Not-sent low watermark for socket send buffers — the
	Linux-specific `TCP_NOTSENT_LOWAT` TCP socket option.
	"""
	sendNotSentLowWatermark: Int
	"""
	Starting threshold of the rate-based choker (`chokingAlgorithm:
	RATE_BASED`): peers are visited in decreasing upload rate, the
	threshold grows proportionally with each visited peer, and the
	peers whose upload rate exceeds it are unchoked. A higher start
	value yields fewer unchoke slots; a lower one, more.
	"""
	rateChokerInitialThreshold: Int
	"""
	Requested expiration time of UPnP port mappings, in seconds; 0
	requests a permanent lease. Some routers mishandle expiring
	mappings without reporting an error — use 0 for those. Otherwise,
	do not set it below 5 minutes.
	"""
	upnpLeaseDuration: Int
	"""
	Maximum concurrent HTTP tracker announces; further announces are
	queued and issued as outstanding ones complete.
	"""
	maxConcurrentHttpAnnounces: Int
	"""
	Maximum number of peers sent in a reply to a DHT `get_peers`
	query.
	"""
	dhtMaxPeersReply: Int
	"""
	Number of concurrent search requests the DHT node sends when
	announcing and refreshing the routing table — the `alpha`
	parameter of the Kademlia paper.
	"""
	dhtSearchBranching: Int
	"""
	Failed contact attempts before a DHT node is removed from the
	routing table. Only relevant when no working replacement is
	known; a failing node with a known replacement is replaced
	immediately.
	"""
	dhtMaxFailCount: Int
	"""
	Maximum torrents tracked by the DHT node — an upper bound that
	keeps malicious nodes from forcing unbounded memory use.
	"""
	dhtMaxTorrents: Int
	"""
	Maximum immutable/mutable items the DHT node stores.
	"""
	dhtMaxDhtItems: Int
	"""
	Maximum peers the DHT node stores per torrent.
	"""
	dhtMaxPeers: Int
	"""
	Seconds a remote DHT node stays banned after exceeding the rate
	limit. The rate limit (`dhtBlockRatelimit`) is averaged over 10
	seconds to allow bursts.
	"""
	dhtBlockTimeout: Int
	"""
	Maximum packets per second a remote DHT node may send before it
	is banned (see `dhtBlockTimeout`).
	"""
	dhtBlockRatelimit: Int
	"""
	Seconds until a stored immutable/mutable DHT item expires. 0 (the
	default) means it never expires.
	"""
	dhtItemLifetime: Int
	"""
	Seconds between recomputations of the DHT info-hash sample: the
	node precomputes a subset of its tracked info-hashes and serves
	that instead of recomputing per request. Valid range 0..=21600.
	"""
	dhtSampleInfohashesInterval: Int
	"""
	Maximum elements in the sampled info-hash subset. Very large
	values may be clamped by the DHT storage so replies still fit in
	UDP packets.
	"""
	dhtMaxInfohashesSampleCount: Int
	"""
	Maximum number of pieces allowed in metadata received via magnet
	links.
	"""
	maxPieceCount: Int
	"""
	Maximum bencoded tokens parsed from metadata (.torrent contents)
	received from peers — a denial-of-service guard that may need
	raising for very large torrents.
	"""
	metadataTokenLimit: Int
	"""
	With the mmap disk I/O backend, files smaller than this many 16
	KiB blocks are not memory-mapped but accessed with plain
	pread/pwrite.
	"""
	mmapFileSizeCutoff: Int
	"""
	Port reported to trackers and the DHT as the `port` announce
	parameter, without affecting the actual listen port or Local
	Service Discovery. 0 (the default) reports the real listening
	port.
	
	Only for special setups where the externally reachable port
	differs from the local one — for example, a local proxy providing
	a reverse tunnel through NAT-PMP, where peers must connect to the
	external NAT-PMP port.
	"""
	announcePort: Int
	"""
	Requested lifetime of NAT-PMP and PCP port mappings, in seconds.
	"""
	natpmpLeaseDuration: Int
	"""
	The user agent identity to present. `UNRECOGNIZED` is read-only
	and rejected here.
	"""
	userAgent: UserAgent
	"""
	Proxy for outgoing connections; `null` removes the proxy and
	resets its backing settings.
	"""
	proxy: ProxySettingsInput
	"""
	I2P SAM bridge configuration; `null` disables I2P.
	"""
	i2p: I2pSettingsInput
	"""
	BitTorrent protocol encryption policy.
	"""
	encryption: EncryptionSettingsInput
	"""
	Enabled peer transport protocols, per direction.
	"""
	peerTransports: PeerTransportsInput
	"""
	Source-port range for outgoing peer connections; `null` restores
	OS-selected ephemeral ports.
	"""
	outgoingPortRange: PortRangeInput
	"""
	OS cache behavior of disk reads and writes.
	"""
	diskIoCache: DiskIoCacheInput
	"""
	How to flush pieces to disk with the mmap disk I/O backend.
	"""
	mmapWriteMode: MmapWriteMode
	"""
	Whether to send `suggest` messages to peers.
	"""
	suggestMode: SuggestMode
	"""
	Which algorithm chooses peers to unchoke.
	"""
	chokingAlgorithm: ChokingAlgorithm
	"""
	Which algorithm chooses peers to unchoke while seeding.
	"""
	seedChokingAlgorithm: SeedChokingAlgorithm
	"""
	How rate limits are divided between TCP and uTP peers.
	"""
	mixedModeAlgorithm: MixedModeAlgorithm
	"""
	Interfaces/adapters for outgoing connections. An empty list lets
	the OS route.
	"""
	outgoingInterfaces: [String!]
	"""
	Listen endpoints for incoming connections.
	"""
	listenInterfaces: [ListenInterfaceInput!]
	"""
	DHT bootstrap nodes. An empty list means no bootstrap nodes.
	"""
	dhtBootstrapNodes: [HostPortInput!]
}

"""
A SHA-1 digest: 40 hex characters.
"""
scalar Sha1Sum

"""
A SHA-256 digest: 64 hex characters.
"""
scalar Sha256Sum

"""
Whether a metric only ever increases or fluctuates.
"""
enum StatKind {
	"""
	The value only ever increases.
	"""
	COUNTER
	"""
	The value can rise and fall.
	"""
	GAUGE
}

"""
One session-statistics metric sample.
"""
type StatValue {
	"""
	Metric name, e.g. `net.recv_payload_bytes`. The set of names
	depends on the daemon build; discover it by querying
	`sessionStats` without a `names` filter.
	"""
	name: String!
	"""
	Whether the metric is a counter or a gauge.
	"""
	kind: StatKind!
	"""
	The current value.
	"""
	value: Int!
}

"""
The torrent's lifecycle state changed.
"""
type StateChangedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
	"""
	The new state.
	"""
	state: TorrentState!
	"""
	The previous state.
	"""
	prevState: TorrentState!
}

"""
A batch of status snapshots of torrents that changed recently.
Produced about once per second while an unfiltered `torrentEvents`
or a `torrentChanged` subscription is active.
"""
type StateUpdateEvent {
	"""
	The changed torrents.
	"""
	torrents: [Torrent!]!
}

"""
Storage allocation mode.
"""
enum StorageMode {
	"""
	Full file allocation up front.
	"""
	ALLOCATE
	"""
	Sparse files, allocated as pieces arrive.
	"""
	SPARSE
	"""
	A mode this API version does not recognize.
	"""
	UNKNOWN
}

"""
The torrent's storage finished moving (the outcome of
`moveStorage`).
"""
type StorageMovedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
	"""
	The new save path.
	"""
	path: String!
}

"""
Moving the torrent's storage failed.
"""
type StorageMovedFailedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
	"""
	Failure description, when the engine supplied one.
	"""
	error: String
}

"""
Live event streams (served over graphql-ws). Streams have no replay
or resume: after a reconnect, re-query current state. All streams
end when the daemon shuts down.
"""
type SubscriptionRoot {
	"""
	Torrent events from the engine event bus, optionally filtered to
	a single torrent (which excludes session-level events, including
	`StateUpdateEvent` batches; filtering on an unknown torrent
	fails at subscription start). An unfiltered subscription
	activates the engine's periodic `StateUpdateEvent` batches. A
	slow consumer that falls behind is disconnected (the stream
	ends), since missed events can include removals: resubscribe and
	take a fresh snapshot.
	"""
	torrentEvents(uuid: UUID): TorrentEvent!
	"""
	Non-empty batches of status snapshots of torrents that changed,
	about once per second — optionally restricted to one torrent
	(filtering on an unknown torrent fails at subscription start).
	Subscribing activates the engine's periodic state updates.
	"""
	torrentChanged(uuid: UUID): [Torrent!]!
	"""
	Progress of one torrent-creation job: the current snapshot
	immediately, then coalesced changes, ending with one terminal
	snapshot. An unknown or pruned job id fails at subscription
	start.
	"""
	createJobProgress(id: Int!): CreateJob!
	"""
	Session statistics counters: one sample immediately, then one
	per interval (all metrics, or the named subset; unknown names
	are silently omitted). `intervalMs` is clamped to at least 100;
	missed ticks are skipped.
	"""
	sessionStats(intervalMs: Int! = 1000, names: [String!]): [StatValue!]!
}

"""
Whether to send `suggest` messages to peers.
"""
enum SuggestMode {
	"""
	Send no piece suggestions.
	"""
	NONE
	"""
	Suggest pieces that are in the read cache (cheap to serve).
	"""
	READ_CACHE
}

"""
A torrent in the session.

Scalar fields come from one status snapshot taken when the object
was resolved; `pieces`, `files`, `trackers`, and `peers` issue
separate live requests and can reflect a slightly later state.
"""
type Torrent {
	"""
	The torrent's durable identifier: minted when the torrent is
	added, stable across daemon restarts, and the sole key for all
	torrent operations.
	"""
	uuid: UUID!
	"""
	The v1 (SHA-1) info-hash, if the torrent has one. A hybrid
	magnet may gain it when metadata arrives.
	"""
	infoHashV1: Sha1Sum
	"""
	The v2 (SHA-256) info-hash, if the torrent has one. A hybrid
	magnet may gain it when metadata arrives.
	"""
	infoHashV2: Sha256Sum
	"""
	Display name: from metadata, or the provisional add/magnet name
	before metadata.
	"""
	name: String!
	"""
	The torrent's current primary task.
	"""
	state: TorrentState!
	"""
	Completion of the currently selected files, 0..=1.
	"""
	progress: Float!
	"""
	Completion in parts-per-million (avoids float rounding).
	"""
	progressPpm: Int!
	"""
	The error that stopped the torrent, or `null` if none.
	"""
	error: TorrentErrorInfo
	"""
	The daemon-local directory the torrent is stored in.
	"""
	savePath: String!
	"""
	URL of the last working tracker, or `null` if none has responded
	yet.
	"""
	currentTracker: String
	"""
	Seconds until the next scheduled tracker announce.
	"""
	nextAnnounceSeconds: Int!
	"""
	Bytes received during the current active run, including protocol
	overhead; resets when the torrent is paused and restarted.
	"""
	totalDownload: Int!
	"""
	Bytes sent during the current active run, including protocol
	overhead; resets when the torrent is paused and restarted.
	"""
	totalUpload: Int!
	"""
	Payload bytes received during the current active run; resets
	when the torrent is paused and restarted.
	"""
	totalPayloadDownload: Int!
	"""
	Payload bytes sent during the current active run; resets when
	the torrent is paused and restarted.
	"""
	totalPayloadUpload: Int!
	"""
	Bytes downloaded that failed the hash check, for the current
	active run.
	"""
	totalFailedBytes: Int!
	"""
	Bytes downloaded more than once (redundant), for the current
	active run.
	"""
	totalRedundantBytes: Int!
	"""
	Bytes downloaded and verified (of the whole torrent).
	"""
	totalDone: Int!
	"""
	Size of the whole torrent in bytes; `null` until metadata is
	available.
	"""
	totalSize: Int
	"""
	Bytes done of the selected files.
	"""
	totalWantedDone: Int!
	"""
	Bytes of the selected files.
	"""
	totalWanted: Int!
	"""
	Persistent payload bytes sent across all runs, restored from
	resume data.
	"""
	allTimeUpload: Int!
	"""
	Persistent payload bytes received across all runs, restored from
	resume data.
	"""
	allTimeDownload: Int!
	"""
	Unix time the torrent was added.
	"""
	addedTime: Int!
	"""
	Unix time the torrent finished; `null` if it never has.
	"""
	completedTime: Int
	"""
	Unix time a complete copy of the torrent was last seen in the
	swarm; `null` if never.
	"""
	lastSeenComplete: Int
	"""
	How disk space for the torrent is allocated.
	"""
	storageMode: StorageMode!
	"""
	Position in the download queue; `null` for torrents not in the
	queue (seeds and finished torrents).
	"""
	queuePosition: Int
	"""
	Total download rate, bytes/s.
	"""
	downloadRate: Int!
	"""
	Total upload rate, bytes/s.
	"""
	uploadRate: Int!
	"""
	Payload-only download rate, bytes/s.
	"""
	downloadPayloadRate: Int!
	"""
	Payload-only upload rate, bytes/s.
	"""
	uploadPayloadRate: Int!
	"""
	Connected peers that are seeds.
	"""
	numSeeds: Int!
	"""
	Established peer connections (including seeds).
	"""
	numPeers: Int!
	"""
	Seeds in the swarm per the tracker scrape; `null` when no scrape
	data is available.
	"""
	numComplete: Int
	"""
	Downloaders in the swarm per the tracker scrape; `null` when no
	scrape data is available.
	"""
	numIncomplete: Int
	"""
	Seeds in the known-peer list (connected or not, including failed
	and banned entries).
	"""
	listSeeds: Int!
	"""
	Peers in the known-peer list (connected or not, including failed
	and banned entries).
	"""
	listPeers: Int!
	"""
	Known peers currently usable as connection candidates.
	"""
	connectCandidates: Int!
	"""
	Number of pieces downloaded (the total is `pieces.total`).
	"""
	piecesHave: Int!
	"""
	Estimated distinct copies of the rarest pieces across connected
	peers; the fraction is the share of pieces with more copies than
	the rarest. `null` when unavailable (e.g. while seeding).
	"""
	distributedCopies: Float
	"""
	Block size used for peer requests, in bytes (normally 16 KiB).
	"""
	blockSize: Int!
	"""
	Peers currently unchoked (being uploaded to).
	"""
	numUploads: Int!
	"""
	Peer connections including half-open ones; at least `numPeers`.
	"""
	numConnections: Int!
	"""
	Configured unchoke-slot cap for this torrent (-1 = unlimited).
	"""
	uploadsLimit: Int!
	"""
	Configured connection cap for this torrent (-1 = unlimited).
	"""
	connectionsLimit: Int!
	"""
	Per-torrent upload limit, bytes/s (-1 = no per-torrent limit;
	session-wide limits still apply).
	"""
	uploadLimit: Int!
	"""
	Per-torrent download limit, bytes/s (-1 = no per-torrent limit;
	session-wide limits still apply).
	"""
	downloadLimit: Int!
	"""
	Peers waiting for this torrent's upload rate limiter.
	"""
	upBandwidthQueue: Int!
	"""
	Peers waiting for this torrent's download rate limiter.
	"""
	downBandwidthQueue: Int!
	"""
	Auto-management seeding importance; higher ranks keep their
	seeding slot longer.
	"""
	seedRank: Int!
	"""
	Whether the torrent has state changes not yet saved to resume
	data.
	"""
	needSaveResumeData: Boolean!
	"""
	Whether every piece is present. Differs from `isFinished` when
	files or pieces are skipped via priorities.
	"""
	isSeeding: Boolean!
	"""
	Whether every priority-nonzero piece is present.
	"""
	isFinished: Boolean!
	"""
	The torrent's own pause flag. Does not reflect a global
	`pauseSession`; check `session.isPaused` too.
	"""
	isPaused: Boolean!
	"""
	Whether queue logic may start and stop this torrent (the
	`AUTO_MANAGED` flag).
	"""
	isAutoManaged: Boolean!
	"""
	Whether metadata is available (false for a magnet still fetching
	it).
	"""
	hasMetadata: Boolean!
	"""
	Sum of all non-pad file sizes (what is actually written to disk);
	`null` until metadata is available.
	"""
	sizeOnDisk: Int
	"""
	Byte length of each piece (except possibly the last one); `null`
	until metadata is available.
	"""
	pieceLength: Int
	"""
	Whether the torrent is private (BEP 27); `null` until metadata is
	available.
	"""
	isPrivate: Boolean
	"""
	Whether this is an i2p torrent (a tracker URL has an `.i2p`
	domain); `null` until metadata is available.
	"""
	isI2P: Boolean
	"""
	Whether an incoming connection has ever been received for this
	torrent (an indication of reachability, not a live connection).
	"""
	hasIncoming: Boolean!
	"""
	Whether a `moveStorage` operation is in progress.
	"""
	movingStorage: Boolean!
	"""
	Whether auto-management currently lets the torrent announce to
	its trackers.
	"""
	announcingToTrackers: Boolean!
	"""
	Whether auto-management currently lets the torrent announce via
	Local Service Discovery.
	"""
	announcingToLsd: Boolean!
	"""
	Whether auto-management currently lets the torrent announce to
	the DHT.
	"""
	announcingToDht: Boolean!
	"""
	The torrent's active option flags.
	"""
	flags: [TorrentFlag!]!
	"""
	A magnet link (info-hashes and display name only).
	"""
	magnetUri: String!
	"""
	Piece availability; set `includeBitfield` for the packed bitfield.
	"""
	pieces(includeBitfield: Boolean! = false): PieceInfo!
	"""
	Per-file details; `null` until metadata is available. Paths
	reflect renames applied via `renameFile`.
	"""
	files: [TorrentFile!]
	"""
	The torrent's trackers.
	"""
	trackers: [Tracker!]!
	"""
	The torrent's current HTTP/web seed URLs (BEP 19), including ones
	added via `addUrlSeed`.
	"""
	urlSeeds: [String!]!
	"""
	Currently connected peers.
	"""
	peers: [Peer!]!
}

"""
A torrent was added and registered in the session.
"""
type TorrentAddedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
}

"""
Payload/partfile deletion after `removeTorrent(deleteFiles: true)`
failed.
"""
type TorrentDeleteFailedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
	"""
	Failure description, when the engine supplied one.
	"""
	error: String
}

"""
Payload/partfile deletion after `removeTorrent(deleteFiles: true)`
completed.
"""
type TorrentDeletedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
}

"""
The torrent entered an error state and stopped.
"""
type TorrentErrorEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
	"""
	Error description, when the engine supplied one.
	"""
	error: String
	"""
	The affected file path; `null` when the error is not
	file-related.
	"""
	filename: String
}

"""
A torrent-level error (the torrent is stopped until it is cleared).
"""
type TorrentErrorInfo {
	"""
	Human-readable error message.
	"""
	message: String!
	"""
	Index of the file the error relates to, or a negative sentinel:
	-1 none/not file-specific, -3 SSL context, -4 metadata,
	-5 internal exception, -6 partfile.
	"""
	file: Int!
}

"""
Union of all possible torrent events.
"""
union TorrentEvent = TorrentAddedEvent | TorrentRemovedEvent | TorrentFinishedEvent | MetadataReceivedEvent | MetadataFailedEvent | TorrentErrorEvent | StateChangedEvent | StateUpdateEvent | ResumeDataSavedEvent | ResumeDataFailedEvent | FileRenamedEvent | FileRenameFailedEvent | StorageMovedEvent | StorageMovedFailedEvent | ReadPieceEvent | TrackersEvent | PeersEvent | FileProgressEvent | ScrapeReplyEvent | ScrapeFailedEvent | TorrentDeletedEvent | TorrentDeleteFailedEvent | SessionErrorEvent

"""
One file within a torrent, in metadata (index) order.
"""
type TorrentFile {
	"""
	Zero-based file index, as used by `renameFile` and the priority
	mutations.
	"""
	index: Int!
	"""
	Path relative to the save path.
	"""
	path: String!
	"""
	File size in bytes.
	"""
	size: Int!
	"""
	Byte offset within the torrent.
	"""
	offset: Int!
	"""
	Download priority (0 = don't download, 1..=7, default 4). A
	priority-0 file can still gain partial data from boundary pieces
	it shares with wanted files.
	"""
	priority: Int!
	"""
	Bytes of this file downloaded so far.
	"""
	progressBytes: Int!
	"""
	Whether this is a pad file: alignment filler defined by the
	metadata, not ordinary payload.
	"""
	isPadFile: Boolean!
	"""
	Whether the file is stored as a symlink (BEP 47).
	"""
	isSymlink: Boolean!
	"""
	The symlink's target path, when `isSymlink` is set.
	"""
	symlinkTarget: String
	"""
	Whether the file has the executable attribute.
	"""
	isExecutable: Boolean!
	"""
	Whether the file has the hidden attribute.
	"""
	isHidden: Boolean!
}

"""
All selected (priority-nonzero) content finished downloading.
"""
type TorrentFinishedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
}

"""
A torrent option flag. Read via `Torrent.flags`, changed via
`setTorrentFlags` (some flags are only meaningful at add time or are
managed by the engine, as noted per value).
"""
enum TorrentFlag {
	"""
	Trust that all files are complete and verify pieces lazily, on
	first request. Only meaningful when adding a torrent with
	metadata; a failed hash check leaves seed mode and triggers a
	recheck.
	"""
	SEED_MODE
	"""
	Make no piece requests, only upload. Auto-management may clear
	it (e.g. after a disk error is resolved).
	"""
	UPLOAD_MODE
	"""
	Download only pieces that improve the share ratio instead of the
	whole content. Do not combine with manual file/piece priorities.
	"""
	SHARE_MODE
	"""
	Apply the session IP filter to this torrent. Set by default.
	"""
	APPLY_IP_FILTER
	"""
	The torrent's own pause flag: no announces, no connections.
	Auto-management can resume a paused torrent; prefer the
	`pauseTorrent`/`resumeTorrent` mutations.
	"""
	PAUSED
	"""
	Let the queue logic start, pause, and rotate this torrent
	automatically.
	"""
	AUTO_MANAGED
	"""
	Treat adding a duplicate torrent as an error. The daemon forces
	this flag on every add; it has no effect after adding.
	"""
	DUPLICATE_IS_ERROR
	"""
	Include the torrent in changed-status batches (`torrentChanged`
	updates and `StateUpdateEvent` batches). Only effective at add
	time: libtorrent does not honor runtime changes, so
	`setTorrentFlags` rejects them.
	"""
	UPDATE_SUBSCRIBE
	"""
	Super-seeding (initial seeding) mode; effective only while the
	torrent is a seed.
	"""
	SUPER_SEEDING
	"""
	Prefer downloading pieces in index order. Not a streaming
	guarantee; piece deadlines serve streaming better.
	"""
	SEQUENTIAL_DOWNLOAD
	"""
	One-shot: when the torrent is ready to transfer data, clear
	auto-management, pause it, and clear this flag. Useful for
	fetching metadata or checking files without starting a transfer.
	"""
	STOP_WHEN_READY
	"""
	Ephemeral marker that resume data is outdated; normally managed
	and cleared by the engine's resume persistence.
	"""
	NEED_SAVE_RESUME
	"""
	Do not announce this torrent to the DHT.
	"""
	DISABLE_DHT
	"""
	Do not announce this torrent via Local Service Discovery.
	"""
	DISABLE_LSD
	"""
	Do not exchange peers for this torrent via PEX.
	"""
	DISABLE_PEX
	"""
	Trust resume data unconditionally, without checking the files on
	disk. Unsafe when the resume data or files may be stale.
	"""
	NO_VERIFY_FILES
	"""
	Files without an explicit priority default to priority 0 (don't
	download); useful for magnets, whose file list is unknown at add
	time. Only meaningful at add time.
	"""
	DEFAULT_DONT_DOWNLOAD
	"""
	Treat this as an I2P torrent for the mixed-peer policy; normally
	inferred from `.i2p` tracker URLs.
	"""
	I2P_TORRENT
	"""
	For hybrid torrents, validate only v2 hashes. Only meaningful at
	add time; no effect on v1-only or v2-only torrents.
	"""
	DISABLE_V1_HASHES
}

"""
A torrent was removed from the session. Disk deletion, if requested,
completes separately (`TorrentDeletedEvent`).
"""
type TorrentRemovedEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
}

"""
Torrent lifecycle state: the torrent's current primary task.
"""
enum TorrentState {
	"""
	Checking existing files against the piece hashes.
	"""
	CHECKING_FILES
	"""
	Downloading metadata (a magnet without its .torrent yet).
	"""
	DOWNLOADING_METADATA
	"""
	Downloading payload data.
	"""
	DOWNLOADING
	"""
	All selected (priority-nonzero) files are complete, but not the
	whole torrent.
	"""
	FINISHED
	"""
	Every piece is present; seeding.
	"""
	SEEDING
	"""
	Validating resume data against the files on disk.
	"""
	CHECKING_RESUME_DATA
	"""
	A state this API version does not recognize.
	"""
	UNKNOWN
}

"""
One tracker of a torrent.
"""
type Tracker {
	"""
	The announce URL.
	"""
	url: String!
	"""
	The tracker-issued tracker id, if it sent one (often empty).
	"""
	trackerId: String!
	"""
	Failover tier: lower tiers are tried first (unless the
	`announceToAllTiers`/`announceToAllTrackers` settings widen
	announcing).
	"""
	tier: Int!
	"""
	Announce failures after which this tracker is no longer tried;
	0 means never give up.
	"""
	failLimit: Int!
	"""
	Whether this tracker has answered an announce.
	"""
	verified: Boolean!
	"""
	Where this tracker URL came from.
	"""
	source: [TrackerSource!]!
}

"""
A tracker announce URL with its failover tier.
"""
input TrackerInput {
	"""
	The announce URL.
	"""
	url: String!
	"""
	Failover tier to place the tracker in (lower is preferred).
	"""
	tier: Int! = 0
}

"""
Where a tracker URL came from.
"""
enum TrackerSource {
	"""
	Part of the .torrent file.
	"""
	TORRENT
	"""
	Added programmatically.
	"""
	CLIENT
	"""
	Part of a magnet link.
	"""
	MAGNET_LINK
	"""
	Received via tracker exchange (TEX).
	"""
	TEX
}

"""
A tracker-list snapshot. There is no operation to request one
directly; it is broadcast whenever serving any client's request
fetches the tracker list (a `Torrent.trackers` selection, or a
mutation that resolves tracker indexes).
"""
type TrackersEvent {
	"""
	The torrent's durable identifier.
	"""
	torrentUuid: UUID!
	"""
	The torrent's trackers, in current tracker order.
	"""
	trackers: [Tracker!]!
}

"""
Whether one transport is enabled, per connection direction.
"""
type TransportDirections {
	"""
	Accept incoming connections over this transport.
	"""
	incoming: Boolean!
	"""
	Make outgoing connections over this transport.
	"""
	outgoing: Boolean!
}

"""
Whether one transport is enabled, per connection direction.
"""
input TransportDirectionsInput {
	"""
	Accept incoming connections over this transport.
	"""
	incoming: Boolean!
	"""
	Make outgoing connections over this transport.
	"""
	outgoing: Boolean!
}

"""
A UUID is a unique 128-bit number, stored as 16 octets. UUIDs are parsed as
Strings within GraphQL. UUIDs are used to assign unique identifiers to
entities without requiring a central allocating authority.

# References

* [Wikipedia: Universally Unique Identifier](http://en.wikipedia.org/wiki/Universally_unique_identifier)
* [RFC4122: A Universally Unique Identifier (UUID) URN Namespace](http://tools.ietf.org/html/rfc4122)
"""
scalar UUID

"""
The user agent identity presented to trackers and peers.
"""
enum UserAgent {
	"""
	No user agent: an empty user-agent string.
	"""
	NONE
	"""
	The stock identity of the embedded BitTorrent engine.
	"""
	LIBTORRENT
	"""
	This daemon's own identity.
	"""
	RSBTD
	"""
	Impersonates qBittorrent (a fixed, known-good version) for
	trackers that whitelist specific clients.
	"""
	QBITTORRENT
	"""
	The effective value was set outside this API (e.g. session state
	persisted by a different daemon version). Read-only: writing it
	is rejected.
	"""
	UNRECOGNIZED
}

"""
Component versions.
"""
type VersionInfo {
	"""
	The rsbtd daemon version.
	"""
	daemon: String!
	"""
	The version of the embedded BitTorrent engine.
	"""
	libtorrent: String!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: QueryRoot
	mutation: MutationRoot
	subscription: SubscriptionRoot
}

