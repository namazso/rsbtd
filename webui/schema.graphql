	"""
	The connection runs over an I2P socket.
	"""
	I2P_SOCKET
	"""
	The connection runs over uTP.
	"""
	UTP_SOCKET
	"""
	The connection runs over SSL/TLS.
	"""
	SSL_SOCKET
	"""
	The connection is encrypted with the RC4 method (full-stream
